# image for build and test stages
image: node:latest

# cache dependecies
cache:
  paths:
    - ./socioprophet-web/client/node_modules/

stages:
  # - build
  # - test
  - docker_image

# build:
#   stage: build
#   script:
#     - make build_web
#     - make build_client

# test:
#   stage: test
#   script:
#     - "cd ./socioprophet-web/client/ && yarn test"

docker_image:
  stage: docker_image
  image: docker:stable

  variables:
    DOCKER_DRIVER: overlay
    GCP_PROJECT_ID: socioprophet-web
    GITLAB_GROUP_NAME: socioprophet
    GITLAB_PROJECT_NAME: socioprophet
    IMAGE_NAME_CLIENT: sp-client
    IMAGE_NAME_SERVER: sp-server

  services:
    - docker:dind

  script:
    - echo $GCP_PROJECT_ID
    - docker login -u _json_key -p "$GCLOUD_SERVICE_KEY" https://gcr.io

    - echo $IMAGE_NAME_CLIENT

    - "cd ./socioprophet-web/client/ && docker build -t gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME_CLIENT:1.0.7 ."
    - docker push gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME_CLIENT:1.0.7

    # - echo $IMAGE_NAME_SERVER
    # - "cd ../server/ && docker build -t gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME_SERVER:release-candidate ."
    # - docker push gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME_SERVER:release-candidate

    # - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

    # - echo $IMAGE_NAME_CLIENT
    # - "cd ../client/ && docker build -t registry.gitlab.com/$GITLAB_GROUP_NAME/$GITLAB_PROJECT_NAME/$IMAGE_NAME_CLIENT:latest ."
    # - docker push registry.gitlab.com/$GITLAB_GROUP_NAME/$GITLAB_PROJECT_NAME/$IMAGE_NAME_CLIENT:latest

    # - echo $IMAGE_NAME_SERVER
    # - "cd ../server/ && docker build -t registry.gitlab.com/$GITLAB_GROUP_NAME/$GITLAB_PROJECT_NAME/$IMAGE_NAME_SERVER:latest ."
    # - docker push registry.gitlab.com/$GITLAB_GROUP_NAME/$GITLAB_PROJECT_NAME/$IMAGE_NAME_SERVER:latest

  #   # after_script:
  #   # - docker logout  <--- add this in, not sure yet

  only:
    - master
