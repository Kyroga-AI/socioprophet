kind = "web"
previewPath = "/"
title = "SocioProphet"
version = "1.0.0"
id = "artifacts/socioprophet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22145

[services.development]
run = "pnpm --filter @workspace/socioprophet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/socioprophet", "run", "build" ]
publicDir = "artifacts/socioprophet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22145"
BASE_PATH = "/"
